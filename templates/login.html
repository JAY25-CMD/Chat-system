<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f3f4f6" />
        <title>Log in | Chat</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <script>
            document.documentElement.classList.toggle(
                "dark",
                localStorage.getItem("theme") === "dark",
            );
        </script>
        <style>
            :root {
                color-scheme: light;
                --page-bg: #f3f4f6;
                --card-bg: #ffffff;
                --field-bg: #f3f4f6;
                --text: #111827;
                --muted: #6b7280;
                --border: #e5e7eb;
                --accent: #4f46e5;
                --accent-hover: #4338ca;
                --error-bg: #fef2f2;
                --error-text: #b91c1c;
                --success-bg: #f0fdf4;
                --success-text: #15803d;
                --shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
            }

            :root.dark {
                color-scheme: dark;
                --page-bg: #030712;
                --card-bg: #111827;
                --field-bg: #1f2937;
                --text: #f3f4f6;
                --muted: #9ca3af;
                --border: #374151;
                --accent: #6366f1;
                --accent-hover: #4f46e5;
                --error-bg: rgba(127, 29, 29, 0.3);
                --error-text: #fecaca;
                --success-bg: rgba(20, 83, 45, 0.3);
                --success-text: #bbf7d0;
                --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0;
                padding: 5rem 1.25rem 2rem;
                display: grid;
                place-items: center;
                overflow-x: hidden;
                position: relative;
                background:
                    radial-gradient(
                        ellipse at 12% 12%,
                        rgba(99, 102, 241, 0.14),
                        transparent 36%
                    ),
                    radial-gradient(
                        ellipse at 90% 88%,
                        rgba(139, 92, 246, 0.11),
                        transparent 35%
                    ),
                    var(--page-bg);
                color: var(--text);
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                transition:
                    background-color 180ms ease,
                    color 180ms ease;
            }

            .theme-toggle {
                position: absolute;
                top: 1.25rem;
                right: 1.25rem;
                width: 2.75rem;
                height: 2.75rem;
                display: grid;
                place-items: center;
                color: var(--muted);
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 0.85rem;
                box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
                font-size: 1rem;
                cursor: pointer;
                transition:
                    color 180ms ease,
                    background-color 180ms ease,
                    transform 180ms ease;
            }

            .theme-toggle:hover {
                color: var(--accent);
                transform: translateY(-1px);
            }

            .auth-card {
                width: min(100%, 26rem);
                padding: 2.5rem;
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 1.25rem;
                box-shadow: var(--shadow);
                transition:
                    background-color 180ms ease,
                    border-color 180ms ease;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin-bottom: 2rem;
            }

            .brand-mark {
                width: 2.75rem;
                height: 2.75rem;
                display: grid;
                place-items: center;
                color: #ffffff;
                background: linear-gradient(135deg, #6366f1, #8b5cf6);
                border-radius: 0.9rem;
                font-size: 1.1rem;
            }

            .brand-name {
                font-size: 1rem;
                font-weight: 750;
                letter-spacing: -0.025em;
            }

            .brand-caption {
                margin-top: 0.15rem;
                color: var(--muted);
                font-size: 0.75rem;
            }

            h1 {
                margin: 0;
                font-size: clamp(1.6rem, 5vw, 1.9rem);
                font-weight: 750;
                letter-spacing: -0.04em;
            }

            .intro {
                margin: 0.5rem 0 1.75rem;
                color: var(--muted);
                font-size: 0.9rem;
                line-height: 1.5;
            }

            .alert {
                display: flex;
                align-items: flex-start;
                gap: 0.65rem;
                margin-bottom: 1.25rem;
                padding: 0.8rem 0.9rem;
                border: 1px solid transparent;
                border-radius: 0.75rem;
                font-size: 0.85rem;
                line-height: 1.45;
            }

            .alert-error {
                color: var(--error-text);
                background: var(--error-bg);
                border-color: rgba(239, 68, 68, 0.18);
            }

            .alert-success {
                color: var(--success-text);
                background: var(--success-bg);
                border-color: rgba(34, 197, 94, 0.18);
            }

            .field {
                margin-bottom: 1.1rem;
            }

            label {
                display: block;
                margin-bottom: 0.45rem;
                font-size: 0.82rem;
                font-weight: 650;
            }

            .input-wrap {
                position: relative;
            }

            .input-wrap > i {
                position: absolute;
                top: 50%;
                left: 0.95rem;
                color: var(--muted);
                font-size: 0.9rem;
                transform: translateY(-50%);
                pointer-events: none;
            }

            input {
                width: 100%;
                height: 3rem;
                padding: 0 0.9rem 0 2.7rem;
                color: var(--text);
                background: var(--field-bg);
                border: 1px solid var(--border);
                border-radius: 0.75rem;
                outline: none;
                font: inherit;
                font-size: 0.9rem;
                transition:
                    border-color 160ms ease,
                    box-shadow 160ms ease,
                    background-color 180ms ease;
            }

            input::placeholder {
                color: var(--muted);
                opacity: 0.8;
            }

            input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
            }

            .submit-button {
                width: 100%;
                min-height: 3rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.6rem;
                margin-top: 0.4rem;
                color: #ffffff;
                background: var(--accent);
                border: 0;
                border-radius: 0.75rem;
                font: inherit;
                font-size: 0.9rem;
                font-weight: 700;
                cursor: pointer;
                transition:
                    background-color 160ms ease,
                    transform 160ms ease;
            }

            .submit-button:hover {
                background: var(--accent-hover);
                transform: translateY(-1px);
            }

            .account-link {
                margin: 1.5rem 0 0;
                color: var(--muted);
                font-size: 0.88rem;
                text-align: center;
            }

            a {
                color: var(--accent);
                font-weight: 700;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            @media (max-width: 480px) {
                body {
                    padding-right: 1rem;
                    padding-left: 1rem;
                }

                .auth-card {
                    padding: 1.75rem 1.35rem;
                }
            }
        </style>
    </head>
    <body>
        <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Switch to dark mode"
            title="Toggle light/dark mode"
        >
            <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
        </button>
        <main class="auth-card">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <div class="brand-name">Chat</div>
                    <div class="brand-caption">Stay connected</div>
                </div>
            </div>
            <h1>Welcome back</h1>
            <p class="intro">Log in to continue your conversations.</p>
            {{if .Error}}
            <div class="alert alert-error" role="alert">
                <i
                    class="fa-solid fa-circle-exclamation"
                    aria-hidden="true"
                ></i>
                <span>{{.Error}}</span>
            </div>
            {{end}} {{if .Success}}
            <div class="alert alert-success" role="status">
                <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                <span>{{.Success}}</span>
            </div>
            {{end}}
            <form method="POST" action="/login">
                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        <input
                            id="username"
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                            autofocus
                        />
                    </div>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        />
                    </div>
                </div>
                <button class="submit-button" type="submit">
                    Log in
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>
            <p class="account-link">
                No account? <a href="/register">Create one</a>
            </p>
        </main>
        <script>
            var themeToggle = document.getElementById("themeToggle");
            var themeIcon = document.getElementById("themeIcon");

            function applyTheme(isDark) {
                document.documentElement.classList.toggle("dark", isDark);
                themeIcon.className = isDark
                    ? "fa-solid fa-sun"
                    : "fa-solid fa-moon";
                themeToggle.setAttribute(
                    "aria-label",
                    isDark ? "Switch to light mode" : "Switch to dark mode",
                );
            }

            applyTheme(localStorage.getItem("theme") === "dark");
            themeToggle.addEventListener("click", function () {
                var isDark =
                    !document.documentElement.classList.contains("dark");
                applyTheme(isDark);
                localStorage.setItem("theme", isDark ? "dark" : "light");
            });
        </script>
    </body>
</html>
